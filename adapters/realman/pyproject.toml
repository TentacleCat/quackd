[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quackd-realman"
dynamic = ["version"]
description = "The RealMan RM_API2 arm adapter for quackd."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["quackd>=0.10,<0.11"]

[project.optional-dependencies]
sdk = ["Robotic_Arm>=1.1.6"]

[project.entry-points."quackd.adapters"]
realman = "quackd_realman"

[project.urls]
Homepage = "https://github.com/RealManRobot/RM_API2"
Documentation = "https://github.com/rokbenko/quackd"

[tool.hatch.version]
path = "src/quackd_realman/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quackd_realman"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
quackd = { workspace = true }
